name: Bug — Incident
description: Signaler un incident ou dysfonctionnement sur l'application
labels: []
body:
  - type: dropdown
    id: severity
    attributes:
      label: Sévérité
      description: Choisir le niveau de sévérité selon l'impact sur le service
      options:
        - "Bloquant critique — service inutilisable, aucune solution de contournement"
        - "Bloquant fort — service inutilisable, contournement possible"
        - "Majeur — service intermittent ou dégradé"
        - "Mineur — altération de qualité, service toujours opérationnel"
    validations:
      required: true

  - type: dropdown
    id: environment
    attributes:
      label: Environnement concerné
      options:
        - "Production"
        - "Staging"
        - "Développement"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description de l'incident
      placeholder: Décrivez le problème constaté de façon précise...
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Étapes pour reproduire
      placeholder: |
        1. Aller sur...
        2. Cliquer sur...
        3. Observer...

  - type: textarea
    id: expected
    attributes:
      label: Comportement attendu
      placeholder: Ce qui aurait dû se passer...

  - type: textarea
    id: actual
    attributes:
      label: Comportement observé
      placeholder: Ce qui s'est réellement passé...

  - type: textarea
    id: additional
    attributes:
      label: Informations complémentaires
      placeholder: Logs, captures d'écran, contexte...