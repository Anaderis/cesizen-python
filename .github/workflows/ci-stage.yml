name: CI — Stage

on:
  pull_request:
    branches:
      - stage

jobs:
  tests:
    name: Tests pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Créer le fichier .env
        run: |
          echo "SECRET_KEY=${{ secrets.SECRET_KEY }}" > .env
          echo "DATABASE_URL=sqlite:///./test.db" >> .env
          echo "POSTGRES_DB=cesizen_stage" >> .env
          echo "POSTGRES_USER=postgres" >> .env
          echo "POSTGRES_PASSWORD=postgres" >> .env

      - name: Lancer les tests
        run: python -m pytest tests/ -v

  audit-frontend:
    name: Audit sécurité npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Installer les dépendances frontend
        run: npm install
        working-directory: frontend

      - name: Audit des dépendances npm
        run: npm audit --audit-level=high
        working-directory: frontend

  docker-check:
    name: Build Docker et démarrage containers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Créer le fichier .env.stage
        run: |
          echo "SECRET_KEY=ci-secret-key" > .env.stage
          echo "DATABASE_URL=postgresql://postgres:postgres@db:5432/cesizen_stage" >> .env.stage
          echo "POSTGRES_DB=cesizen_stage" >> .env.stage
          echo "POSTGRES_USER=postgres" >> .env.stage
          echo "POSTGRES_PASSWORD=postgres" >> .env.stage

      - name: Build et démarrage des containers
        run: docker compose -f docker/docker-compose.stage.yml --env-file .env.stage up -d --build

      - name: Attendre que le backend soit prêt
        run: |
          for i in $(seq 1 15); do
            if curl -sf http://localhost:8000/docs > /dev/null 2>&1; then
              echo "Backend prêt"
              exit 0
            fi
            echo "Attente... ($i/15)"
            sleep 3
          done
          echo "Backend non disponible après 45s"
          docker compose -f docker/docker-compose.stage.yml --env-file .env.stage logs backend
          exit 1

      - name: Afficher l'état des containers
        if: always()
        run: docker compose -f docker/docker-compose.stage.yml --env-file .env.stage ps
